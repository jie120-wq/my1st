<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8f5">
  <title>日常待辦</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
      --page: #f6f8f5;
      --surface: #ffffff;
      --surface-soft: #f3f6f2;
      --text: #26352f;
      --muted: #7d8b83;
      --line: #e4ebe5;
      --accent: #3c8064;
      --accent-hover: #2f6c53;
      --accent-wash: #e5f1e9;
      --danger: #bd6254;
      --danger-wash: #fbefed;
      --page-pattern-dot: #dfe9e0;
      --card-border: rgba(219, 229, 220, 0.85);
      --placeholder: #9aa69e;
      --focus-ring: rgba(60, 128, 100, 0.3);
      --footer-muted: #9ba89f;
      --shadow: 0 20px 60px rgba(42, 70, 54, 0.09), 0 3px 10px rgba(42, 70, 54, 0.04);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #18221d;
      --surface: #222f28;
      --surface-soft: #2b3a31;
      --text: #e6eee8;
      --muted: #a5b4a9;
      --line: #3a4a3f;
      --accent: #85bd98;
      --accent-hover: #9acbaa;
      --accent-wash: #334a3a;
      --danger: #e49a8d;
      --danger-wash: #493431;
      --page-pattern-dot: #34453a;
      --card-border: #3a4a3f;
      --placeholder: #a5b4a9;
      --focus-ring: rgba(133, 189, 152, 0.4);
      --footer-muted: #86978b;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.28), 0 3px 10px rgba(0, 0, 0, 0.16);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 56px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--text);
      background-color: var(--page);
      background-image: radial-gradient(var(--page-pattern-dot) 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .todo-card {
      width: min(100%, 520px);
      padding: 38px 40px 24px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .card-header {
      margin-bottom: 28px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: 1.9rem;
      line-height: 1.3;
      font-weight: 750;
    }

    h1 span {
      color: var(--accent);
    }

    .theme-toggle {
      min-height: 38px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .theme-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .todo-form input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid transparent;
      border-radius: 9px;
      font: inherit;
      transition: border-color 150ms ease, background-color 150ms ease;
    }

    .todo-form input::placeholder {
      color: var(--placeholder);
    }

    .todo-form input:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--accent);
    }

    .add-button {
      min-width: 96px;
      height: 48px;
      padding: 0 16px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .add-button:hover {
      background: var(--accent-hover);
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .add-button span:first-child {
      font-size: 1.25rem;
      line-height: 1;
    }

    .filters {
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .filter-button {
      min-height: 38px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--surface-soft);
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
    }

    .filter-button:hover {
      color: var(--text);
    }

    .filter-button.is-active {
      color: var(--accent);
      background: var(--accent-wash);
      border-color: var(--accent);
      font-weight: 700;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      min-height: 54px;
      padding: 10px 11px 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .todo-checkbox {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .todo-item.is-completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .delete-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .delete-button:hover,
    .delete-button:focus-visible {
      color: var(--danger);
      background: var(--danger-wash);
    }

    button:focus-visible,
    .todo-checkbox:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .empty-state {
      margin: 0;
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    .card-footer {
      min-height: 47px;
      margin-top: 20px;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .footer-mark {
      color: var(--footer-muted);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px;
      }

      .todo-card {
        padding: 28px 20px 18px;
        border-radius: 13px;
      }

      .card-header {
        margin-bottom: 23px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .add-button {
        min-width: 82px;
        padding: 0 12px;
      }

      .footer-mark {
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <main class="todo-card" aria-labelledby="page-title">
    <header class="card-header">
      <p class="eyebrow">把今天整理得剛剛好</p>
      <div class="title-row">
        <h1 id="page-title">待辦清單<span aria-hidden="true">.</span></h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換為深色模式" aria-pressed="false">
          <span id="theme-icon" class="theme-icon" aria-hidden="true">☾</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
      <p class="subtitle">一件一件來，讓想做的事有個著落。</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="visually-hidden" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        name="todo"
        type="text"
        placeholder="例如：整理書桌"
        maxlength="200"
        aria-label="待辦事項內容"
      >
      <button class="add-button" type="submit" aria-label="新增待辦事項">
        <span aria-hidden="true">＋</span>
        <span>新增</span>
      </button>
    </form>

    <nav class="filters" aria-label="篩選待辦事項">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <section class="list-section" aria-label="待辦事項">
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>
    </section>

    <footer class="card-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
      <span class="footer-mark" aria-hidden="true">慢慢來，也很好。</span>
    </footer>
  </main>
    <script>
      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const emptyState = document.getElementById('empty-state');
      const remainingCount = document.getElementById('remaining-count');
      const themeToggle = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const themeLabel = document.getElementById('theme-label');
      const filterButtons = document.querySelectorAll('.filter-button');
      const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

      let todos = [];
      let currentFilter = 'all';
      let themeManuallySelected = false;

      // 套用主題並更新切換按鈕的提示。
      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.dataset.theme = theme;
        themeIcon.textContent = isDark ? '☀' : '☾';
        themeLabel.textContent = isDark ? '淺色模式' : '深色模式';
        themeToggle.setAttribute('aria-label', `切換為${themeLabel.textContent}`);
        themeToggle.setAttribute('aria-pressed', String(isDark));
      }

      // 初始主題跟隨作業系統，手動切換只在目前頁面生效。
      applyTheme(colorScheme.matches ? 'dark' : 'light');
      colorScheme.addEventListener('change', (event) => {
        if (!themeManuallySelected) {
          applyTheme(event.matches ? 'dark' : 'light');
        }
      });

      themeToggle.addEventListener('click', () => {
        themeManuallySelected = true;
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });

      // 依照篩選條件重繪清單，並統計所有未完成事項。
      function renderTodos() {
        list.replaceChildren();

        const visibleTodos = todos.filter((todo) => {
          if (currentFilter === 'active') return !todo.completed;
          if (currentFilter === 'completed') return todo.completed;
          return true;
        });

        visibleTodos.forEach((todo) => {
          const item = document.createElement('li');
          item.className = todo.completed ? 'todo-item is-completed' : 'todo-item';
          item.dataset.id = todo.id;

          const checkbox = document.createElement('input');
          checkbox.className = 'todo-checkbox';
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.setAttribute('aria-label', `標記「${todo.text}」為已完成`);

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = todo.text;

          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-button';
          deleteButton.type = 'button';
          deleteButton.textContent = '×';
          deleteButton.setAttribute('aria-label', `刪除「${todo.text}」`);

          item.append(checkbox, text, deleteButton);
          list.append(item);
        });

        emptyState.hidden = visibleTodos.length > 0;
        if (todos.length === 0) {
          emptyState.textContent = '還沒有任何待辦事項,新增一個吧!';
        } else if (currentFilter === 'active') {
          emptyState.textContent = '太棒了，目前沒有未完成的事項。';
        } else {
          emptyState.textContent = '目前沒有已完成的事項。';
        }
        remainingCount.textContent = `未完成:${todos.filter((todo) => !todo.completed).length} 項`;
      }

      // 更新目前選取的篩選條件與按鈕狀態。
      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          filterButtons.forEach((filterButton) => {
            const isSelected = filterButton === button;
            filterButton.classList.toggle('is-active', isSelected);
            filterButton.setAttribute('aria-pressed', String(isSelected));
          });
          renderTodos();
        });
      });

      // 新增前先去除頭尾空白，空白內容不會進入清單。
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        todos.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false,
        });
        renderTodos();
        input.value = '';
        input.focus();
      });

      // 使用事件委派處理各筆待辦的勾選與刪除。
      list.addEventListener('change', (event) => {
        if (!event.target.matches('.todo-checkbox')) return;
        const item = event.target.closest('.todo-item');
        const todo = todos.find((entry) => entry.id === item.dataset.id);
        if (!todo) return;

        todo.completed = event.target.checked;
        renderTodos();
      });

      list.addEventListener('click', (event) => {
        if (!event.target.matches('.delete-button')) return;
        const item = event.target.closest('.todo-item');
        todos = todos.filter((todo) => todo.id !== item.dataset.id);
        renderTodos();
      });

      renderTodos();
    </script>
</body>
</html>
